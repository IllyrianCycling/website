# SEO tooling: regenerate search assets, crawl/audit the live site, and
# optionally push URL_UPDATED notifications to Google when the Indexing API
# service-account secret is configured.
name: SEO checks

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  seo:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install tooling
        working-directory: scripts
        run: npm install

      - name: Regenerate search assets
        working-directory: scripts
        run: |
          node generate-assets.js --inline
          if ! git diff --exit-code ../frontend/sitemap.xml ../frontend/robots.txt ../frontend/schema.json ../frontend/index.html; then
            echo "::notice::Generated SEO assets differ from HEAD — commit the regenerate step."
          fi

      - name: Crawl live site
        working-directory: scripts
        run: node crawler.js --base https://illyriancycling.cc/ --out "${{ github.workspace }}/crawl-report.json"

      - name: Upload crawl report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-report
          path: ${{ github.workspace }}/crawl-report.json

      - name: Notify Google Indexing API
        if: env.GOOGLE_SERVICE_ACCOUNT_KEY_JSON != ''
        working-directory: scripts
        run: node submit-google.js --sitemap ../frontend/sitemap.xml