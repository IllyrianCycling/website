name: Uptime Checker

on:
  schedule:
    - cron: '*/13 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check website uptime
        run: |
          URL="https://illyriancycling.cc/health"
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 30 "$URL")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Website is down or returned a non-200 status"
            exit 1
          fi
